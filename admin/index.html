<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0c0d">
<title>Admin | Enma Designs</title>
<link rel="icon" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0d;--card:#141617;--line:#262a2c;--tx:#f3f4f2;--mu:#98a0a3;--ac:#65f4e4;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 Outfit,system-ui,sans-serif;padding-bottom:calc(6rem + env(safe-area-inset-bottom))}
h1{font-size:1.7rem;letter-spacing:-.03em}h2{font-size:1.2rem;margin:1.8rem 0 .8rem;letter-spacing:-.02em}
input,textarea{width:100%;background:#0f1112;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
button{font:inherit;cursor:pointer;color:var(--tx)}
.p,#save{background:var(--ac);color:#04201d;border:0;border-radius:99px;padding:.85rem 1.4rem;font-weight:700}
.b{background:none;border:1px solid #3a3f42;border-radius:99px;padding:.55rem 1rem;font-size:.95rem}
.b:hover{border-color:var(--ac);color:var(--ac)}.d{border-color:#5a2f2f;color:var(--bad)}
#login{min-height:100svh;display:grid;place-items:center;padding:1.5rem}
#lf{width:min(380px,100%);display:grid;gap:.9rem;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1.8rem}
.err{color:var(--bad);font-size:.95rem}
.top{position:sticky;top:0;z-index:10;background:rgba(11,12,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem}.hd b{flex:1;font-size:1.1rem}.hd a{color:var(--ac)}
#tabs{display:flex;gap:.5rem;overflow-x:auto;padding:0 1rem .7rem;scrollbar-width:none}
#tabs button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.5rem 1rem}
#tabs .on{background:var(--ac);color:#04201d;border-color:var(--ac);font-weight:600}
main{width:min(760px,100% - 2rem);margin:0 auto}
.fd{margin:.9rem 0}.lb{display:block;color:var(--mu);font-size:.9rem;margin-bottom:.35rem}
.ck{display:flex;gap:.7rem;align-items:center;margin:1rem 0}
.row{display:flex;gap:.5rem;align-items:flex-start;margin:.4rem 0}.row input,.row textarea{flex:1}
.it{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:.7rem 0}
.it summary{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.8rem 1rem;cursor:pointer;list-style:none;font-weight:600}
.it summary::-webkit-details-marker{display:none}.it summary>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;gap:.3rem;flex:none}.mv button{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px}
.bd{padding:0 1rem 1rem;border-top:1px solid var(--line)}
.add{width:100%;margin:.6rem 0;padding:1rem;background:none;border:1px dashed #3a3f42;border-radius:20px;color:var(--ac);font-weight:600}
.ths{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.th{width:104px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0f1112}
.th img,.th video{width:100%;height:84px;object-fit:cover}.doc{display:grid;place-items:center;height:84px;font-size:2rem}
.tb{display:flex;justify-content:center;gap:2px;padding:3px}.tb button{flex:1;background:none;border:0;padding:.3rem 0;font-size:.85rem}.tb .d{color:var(--bad)}
.bar{position:fixed;inset:auto 0 0;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:rgba(11,12,13,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#save{width:min(760px,100%);display:block;margin:0 auto;font-size:1.05rem}#save:disabled{opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ac);color:#04201d;padding:.7rem 1.2rem;border-radius:99px;font-weight:600;max-width:90vw;text-align:center;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.err{background:var(--bad);color:#fff}
</style>
</head>
<body>
<section id="login" hidden>
  <form id="lf">
    <h1>Panel de administración</h1>
    <p class="err" id="login-err"></p>
    <input id="em" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="p" type="submit">Entrar</button>
  </form>
</section>
<div id="app" hidden>
  <div class="top"><div class="hd"><b>Enma Designs · Admin</b><a href="/" target="_blank" rel="noopener">Ver sitio ↗</a><button class="b" id="out">Salir</button></div><nav id="tabs"></nav></div>
  <main id="main"></main>
  <div class="bar"><button id="save">Todo guardado ✓</button></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
